$kind: http-request
description: |-
  Starts the thermal control systems. This changes the selected Dock Pro device.

  Reference: https://docs.developer.sleep.me/api/
url: "{{SleepMeAPI_Url}}/devices/:device_id"
method: PATCH
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: device_id
    value: "{{device_id}}"
    description: Claimed device ID from List Devices.
body:
  type: json
  content: |-
    {
      "thermal_control_status": "active"
    }
order: 4000
