$kind: http-request
description: |-
  Set an integer temperature from 55 through 115 F. -1 means MAX COLD; 999 means MAX HEAT. This changes the selected Dock Pro device.

  Reference: https://docs.developer.sleep.me/api/
url: "{{SleepMeAPI_Url}}/devices/:device_id"
method: PATCH
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: device_id
    value: "{{device_id}}"
    description: Claimed device ID from List Devices.
body:
  type: json
  content: |-
    {
      "set_temperature_f": 72
    }
order: 6000
