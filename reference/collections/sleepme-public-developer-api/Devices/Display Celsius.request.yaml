$kind: http-request
description: |-
  Shows Celsius on the unit display. This changes the selected Dock Pro device.

  Reference: https://docs.developer.sleep.me/api/
url: "{{SleepMeAPI_Url}}/devices/:device_id"
method: PATCH
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: device_id
    value: "{{device_id}}"
    description: Claimed device ID from List Devices.
body:
  type: json
  content: |-
    {
      "display_temperature_unit": "c"
    }
order: 11000
